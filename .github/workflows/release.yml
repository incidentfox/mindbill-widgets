name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'sdk-v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm trusted-publishing support
        run: >-
          node -e "const {execFileSync}=require('node:child_process');
          const version=execFileSync('npm',['--version'],{encoding:'utf8'}).trim();
          const [major,minor,patch]=version.split('.').map(Number);
          if(major<11||(major===11&&(minor<5||(minor===5&&patch<1)))) throw new Error('npm 11.5.1 or newer is required for trusted publishing');
          console.log('npm',version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/verify-release-tag.mjs "${{ github.event.release.tag_name }}"
      - run: node scripts/publish.mjs
